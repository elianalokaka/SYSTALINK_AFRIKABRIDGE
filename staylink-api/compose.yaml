services:
  # Laravel + PHP-FPM
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor

    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && exec php-fpm"]

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - "test -f /var/www/html/vendor/autoload.php && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - staylink

  # Serveur web Nginx
  nginx:
    image: nginx:stable-alpine

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www/html:ro
      - vendor_data:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - staylink

  # Base de données PostgreSQL
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit etre defini dans .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - staylink

networks:
  staylink:
    driver: bridge

volumes:
  postgres_data:
  vendor_data: