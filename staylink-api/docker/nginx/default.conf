server {
    listen 80;
    server_name localhost;

    client_max_body_size 16m;
    error_page 413 = @payload_too_large;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    root /var/www/html/public;
    index index.php index.html;

    # Photos et fichiers publics : servir le disque `storage/app/public`
    # sans dépendre du lien symbolique `public/storage` (souvent absent sous Docker/Windows).
    # Les documents de ressources ne sont pas publics : seul GET /api/v1/resources/{id}/file
    # les sert, après vérification du membre.
    location /storage/ressources/ {
        deny all;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location @payload_too_large {
        default_type application/json;
        return 413 '{"message":"Fichier trop volumineux (16 Mo maximum)."}';
    }
}